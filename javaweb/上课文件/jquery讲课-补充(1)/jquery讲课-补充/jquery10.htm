
<pre>
事件代理的使用
一般绑定事件的写法:
</pre>
<script src="jquery-3.2.1.min.js"></script>


<script> 
$(function(){
    $ali = $('#list li');
    $ali.click(function() {
        $(this).css({background:'red'});
    });
})
 </script>
<ul id="list">
    <li>1</li>
    <li>2</li>
    <li>3</li>
    <li>4</li>
    <li>5</li>
</ul>
