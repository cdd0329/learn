
<pre>
prop方法的使用
之前使用css方法可以给标签设置样式属性，
那么设置标签的其它属性可以使用prop方法了


</pre>
<script src="jquery-3.2.1.min.js"></script>


  <style>
    .a01{
        color:red;
    }
</style>
 
<script>
    $(function(){
        var $a = $("#link01");
        var $input = $('#input01')
 
        // 获取元素属性
        var sId = $a.prop("id");
        alert(sId);
 
        // 设置元素属性
        $a.prop({"href":"http://www.baidu.com","title":'这是去到百度的链接',"class":"a01"});
 
        //  获取value属性
        // var sValue = $input.prop("value");
        // alert(sValue);
 
        // 获取value属性使用val()方法的简写方式
        var sValue = $input.val();
        alert(sValue);
        // 设置value值
        $input.val("222222");
    })
</script>
 
<a id="link01">这是一个链接</a>
<input type="text" id="input01" value="111111">
